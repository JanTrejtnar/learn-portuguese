<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#046a38" />
    <title>Portuglove — evropská portugalština</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Učení evropské portugalštiny (PT-PT) pro úrovně A1 a A2: kartičky, testy, scénáře a mluvení." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      // Nastaví tmavý/světlý režim před vykreslením (bez bliknutí).
      try {
        var t = JSON.parse(localStorage.getItem("ap:theme") || "{}").theme;
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
